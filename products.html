<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products | XG Electricals</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      padding: 1.5rem 0;
    }

    .feature {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .feature:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    }

    .feature img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .feature h3 {
      color: #00d1ff;
      margin-top: 1rem;
      font-size: 1.1rem;
    }

    .feature p {
      color: #555;
      padding: 0 1rem;
      font-size: 0.95rem;
    }

    .shop-btn {
      display: inline-block;
      margin: 1rem 0 1.5rem;
      background: #00d1ff;
      color: #fff;
      padding: 0.6rem 1.2rem;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .shop-btn:hover {
      background: #009ec2;
    }

    #productSearch {
      width: 100%;
      max-width: 400px;
      padding: 0.6rem;
      margin: 1rem auto;
      display: block;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .feature p strong {
      color: #009ec2;
    }

    #paginationNav {
      text-align: center;
      margin-top: 2rem;
    }

    #paginationNav button {
      margin: 0 0.5rem;
      padding: 0.5rem 1rem;
      border: none;
      background-color: #00d1ff;
      color: #fff;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    #paginationNav button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header>
    <span class="hamburger" onclick="toggleNav()">&#9776;</span>
    <img src="assets/images/XG.png" alt="XG Logo" class="logo" />
    <div class="header-title">XG Electricals</div>
  </header>

  <nav class="sidebar closed" id="sidebar">
    <h2>XG</h2>
    <a href="index.html">Home</a>
    <a href="products.html" class="active">Products</a>
    <a href="services.html">Services</a>
    <a href="projects.html">Projects</a>
    <a href="about.html">About Us</a>
    <a href="contact.html">Contact</a>
  </nav>

  <main class="main-content" id="main">
    <section class="section" id="products">
      <h2>Our Products</h2>
      <p>Click any product or tap “Shop Now” to chat with us directly on WhatsApp for inquiries and purchases.</p>

      <input type="text" id="productSearch" placeholder="Search products..." />

      <div id="productContainer" class="features"></div>
      <div id="paginationNav"></div>
    </section>
  </main>

  <footer>
    &copy; 2025 XG Electricals. All rights reserved.
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
